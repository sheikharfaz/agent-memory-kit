name: Release to PyPI

# Manual on purpose: publishing is public and irreversible (PyPI never lets a
# version number be reused). Uses PyPI trusted publishing -- no API token is
# stored in this repo. One-time setup on pypi.org: add a "pending" trusted
# publisher for project `agent-memory-kit-cli`, owner `sheikharfaz`, repo
# `agent-memory-kit`, workflow `release.yml`, environment `pypi`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish -- must equal the VERSION file"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the requested version matches VERSION
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          actual="$(cat VERSION)"
          if [ "$actual" != "$REQUESTED" ]; then
            echo "VERSION file says $actual, but $REQUESTED was requested" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
