name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-check:
    name: py_compile (fast fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m compileall -q .

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: compile-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git identity for test fixtures
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Run test suite (zero dependencies -- stdlib unittest only)
        run: python -m unittest discover -s tests -v

  package:
    # The test job exercises `amk` from a checkout. This one proves the thing
    # users actually get: a wheel built from the sdist, installed into a bare
    # venv, with no runtime dependencies, running against a fresh project.
    name: wheel install (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: compile-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist
      - name: Install the wheel into a clean venv
        run: |
          python -m venv amkenv
          if [ -d amkenv/Scripts ]; then BIN=amkenv/Scripts; else BIN=amkenv/bin; fi
          echo "BIN=$PWD/$BIN" >> "$GITHUB_ENV"
          "$BIN/python" -m pip install --quiet dist/*.whl
          "$BIN/python" -c "import importlib.metadata as m; r = m.requires('agent-memory-kit-cli'); assert not r, r; print('runtime deps: none')"
      - name: amk init / doctor / find on a fresh project
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          mkdir project && cd project && git init -q .
          mkdir src && printf 'def refreshUserAuthToken(s):\n    return s\n' > src/auth.py
          git add -A && git commit -q -m init
          "$BIN/amk" version
          "$BIN/agent-memory-kit-cli" version
          "$BIN/amk" init --hooks --mcp
          "$BIN/amk" doctor
          "$BIN/amk" find user auth token | tee find.txt
          grep -q refreshUserAuthToken find.txt
